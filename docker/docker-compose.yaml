services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: my-telegram-bot:latest
    container_name: my-telegram-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Madrid}
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  postgres:
    image: postgres:17
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata: