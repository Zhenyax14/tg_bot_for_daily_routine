{% extends "layout.html" %}
{% block content %}
{% if message %}<div class="msg {{ message_class }}">{{ message }}</div>{% endif %}
<form method="post" action="/location">
 <label for="nombre">Nombre del municipio (España)</label>
 <input id="nombre" name="nombre" placeholder="Benidorm" required>
 <div><button type="submit">Buscar</button></div>
</form>
<p class="cur">
  {% if current_name %}
    Localidad actual: <strong>{{ current_name }}</strong> (INE {{ current_ine }})
  {% else %}
    Localidad actual: INE <strong>{{ current_ine }}</strong>
  {% endif %}
</p>
<form method="post" action="/logout" class="logout"><button type="submit">Cerrar sesión</button></form>
{% endblock %}
